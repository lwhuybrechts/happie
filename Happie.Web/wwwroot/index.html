<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Happie</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="Happie.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>if (navigator.serviceWorker) { navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }); }</script>
    <script>
        window.happie = window.happie || {};

        // Convert a URL-safe base64 string to a Uint8Array for PushManager.subscribe().
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        // Returns the current notification permission state: "granted", "denied", or "default".
        happie.getPushPermissionState = function () {
            if (!('Notification' in window))
                return 'unsupported';
            return Notification.permission;
        };

        // Requests notification permission from the user. Returns the permission result.
        happie.requestPushPermission = async function () {
            if (!('Notification' in window))
                return 'unsupported';
            return await Notification.requestPermission();
        };

        // Subscribes to push notifications using the VAPID public key.
        // Returns an object with endpoint, p256dh, and auth, or null on failure.
        happie.subscribePush = async function (vapidPublicKey) {
            try {
                const registration = await navigator.serviceWorker.ready;
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
                });
                const subscriptionJson = subscription.toJSON();
                return {
                    endpoint: subscriptionJson.endpoint,
                    p256dh: subscriptionJson.keys.p256dh,
                    auth: subscriptionJson.keys.auth
                };
            } catch (error) {
                console.error('Push subscription failed:', error);
                return null;
            }
        };

        // Store push credentials in IndexedDB for the Service Worker to use during subscription renewal.
        happie.storePushCredentials = async function (vapidPublicKey, jwt, housemateId) {
            try {
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('happie-push', 1);
                    request.onupgradeneeded = (e) => {
                        e.target.result.createObjectStore('credentials');
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
                const tx = db.transaction('credentials', 'readwrite');
                const store = tx.objectStore('credentials');
                store.put(vapidPublicKey, 'vapidPublicKey');
                store.put(jwt, 'jwt');
                store.put(housemateId, 'housemateId');
                await new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch (error) {
                console.error('Failed to store push credentials:', error);
            }
        };

        // Minimum horizontal distance (px) to trigger navigation.
        const SWIPE_THRESHOLD = 60;
        // Maximum horizontal drag (px) — adds rubber-band resistance beyond this.
        const MAX_DRAG = 120;
        // Duration (ms) for the slide-out / snap-back animation.
        const ANIM_DURATION = 250;

        // Map from element to its registered swipe state.
        const _swipeRegistry = new Map();

        happie.registerSwipe = function (element, dotNetRef) {
            if (!element) return;

            const state = {
                startX: 0,
                startY: 0,
                currentX: 0,
                tracking: false,
                locked: false,
                animating: false
            };

            // Create edge arrow indicators.
            const leftArrow = document.createElement('div');
            leftArrow.className = 'swipe-arrow swipe-arrow--left';
            leftArrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';

            const rightArrow = document.createElement('div');
            rightArrow.className = 'swipe-arrow swipe-arrow--right';
            rightArrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

            // Arrows are appended to body so they don't move with the translating content.
            document.body.appendChild(leftArrow);
            document.body.appendChild(rightArrow);

            // Apply rubber-band resistance for a natural iOS feel.
            function rubberBand(offset) {
                const abs = Math.abs(offset);
                if (abs <= MAX_DRAG) return offset;
                const over = abs - MAX_DRAG;
                const dampened = MAX_DRAG + over * 0.3;
                return offset > 0 ? dampened : -dampened;
            }

            const onTouchStart = (e) => {
                if (state.animating) return;
                // Ignore touches that originate inside a modal overlay or dialog.
                if (e.target.closest('[role="dialog"], .nudge-modal__overlay, .color-modal__overlay')) return;
                // Ignore touches on input fields so text selection works on iOS.
                if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
                // Ignore touches starting near screen edges so iOS back/forward gestures work.
                const edgeThreshold = 20;
                const touchX = e.touches[0].clientX;
                if (touchX <= edgeThreshold || touchX >= window.innerWidth - edgeThreshold) return;
                state.startX = e.touches[0].clientX;
                state.startY = e.touches[0].clientY;
                state.currentX = 0;
                state.tracking = true;
                state.locked = false;
                element.style.transition = 'none';
                element.style.willChange = 'transform';
            };

            const onTouchMove = (e) => {
                if (!state.tracking || state.animating) return;

                const deltaX = e.touches[0].clientX - state.startX;
                const deltaY = e.touches[0].clientY - state.startY;

                // Determine direction lock on first significant movement.
                if (!state.locked) {
                    if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) return;
                    // If more vertical than horizontal, abort tracking.
                    if (Math.abs(deltaY) > Math.abs(deltaX)) {
                        state.tracking = false;
                        element.style.transform = '';
                        element.style.willChange = '';
                        leftArrow.style.opacity = '0';
                        rightArrow.style.opacity = '0';
                        return;
                    }
                    state.locked = true;
                }

                // Prevent vertical scrolling while horizontal swipe is active.
                e.preventDefault();

                state.currentX = deltaX;
                const translated = rubberBand(deltaX);
                element.style.transform = 'translateX(' + translated + 'px)';

                // Show arrow indicator based on direction and progress.
                const progress = Math.min(Math.abs(deltaX) / SWIPE_THRESHOLD, 1);
                if (deltaX > 0) {
                    leftArrow.style.opacity = progress.toString();
                    leftArrow.classList.toggle('swipe-arrow--active', Math.abs(deltaX) >= SWIPE_THRESHOLD);
                    rightArrow.style.opacity = '0';
                    rightArrow.classList.remove('swipe-arrow--active');
                } else {
                    rightArrow.style.opacity = progress.toString();
                    rightArrow.classList.toggle('swipe-arrow--active', Math.abs(deltaX) >= SWIPE_THRESHOLD);
                    leftArrow.style.opacity = '0';
                    leftArrow.classList.remove('swipe-arrow--active');
                }
            };

            const onTouchEnd = (e) => {
                if (!state.tracking || !state.locked) {
                    state.tracking = false;
                    // Clear will-change so it does not create a containing block
                    // that traps position:fixed children (e.g. modals).
                    element.style.willChange = '';
                    return;
                }
                state.tracking = false;

                const deltaX = state.currentX;
                const absDelta = Math.abs(deltaX);

                if (absDelta >= SWIPE_THRESHOLD) {
                    // Threshold met — slide off screen and navigate.
                    state.animating = true;
                    const direction = deltaX > 0 ? 1 : -1;
                    element.style.transition = 'transform ' + ANIM_DURATION + 'ms cubic-bezier(0.2, 0.9, 0.3, 1), opacity ' + ANIM_DURATION + 'ms ease';
                    element.style.transform = 'translateX(' + (direction * window.innerWidth * 0.4) + 'px)';
                    element.style.opacity = '0.3';

                    setTimeout(function () {
                        // Reset styles before navigation so the new page renders cleanly.
                        element.style.transition = 'none';
                        element.style.transform = '';
                        element.style.opacity = '';
                        element.style.willChange = '';
                        leftArrow.style.opacity = '0';
                        rightArrow.style.opacity = '0';
                        leftArrow.classList.remove('swipe-arrow--active');
                        rightArrow.classList.remove('swipe-arrow--active');
                        state.animating = false;

                        if (deltaX < 0)
                            dotNetRef.invokeMethodAsync('SwipeLeftAsync');
                        else
                            dotNetRef.invokeMethodAsync('SwipeRightAsync');
                    }, ANIM_DURATION);
                } else {
                    // Below threshold — snap back.
                    element.style.transition = 'transform ' + ANIM_DURATION + 'ms cubic-bezier(0.2, 0.9, 0.3, 1)';
                    element.style.transform = 'translateX(0)';
                    leftArrow.style.opacity = '0';
                    rightArrow.style.opacity = '0';
                    leftArrow.classList.remove('swipe-arrow--active');
                    rightArrow.classList.remove('swipe-arrow--active');

                    setTimeout(function () {
                        element.style.transition = '';
                        element.style.transform = '';
                        element.style.willChange = '';
                    }, ANIM_DURATION);
                }
            };

            element.addEventListener('touchstart', onTouchStart, { passive: true });
            element.addEventListener('touchmove', onTouchMove, { passive: false });
            element.addEventListener('touchend', onTouchEnd, { passive: true });

            _swipeRegistry.set(element, { onTouchStart, onTouchMove, onTouchEnd, dotNetRef, leftArrow, rightArrow });
        };

        happie.unregisterSwipe = function (element) {
            if (!element) return;
            const entry = _swipeRegistry.get(element);
            if (!entry) return;
            element.removeEventListener('touchstart', entry.onTouchStart);
            element.removeEventListener('touchmove', entry.onTouchMove);
            element.removeEventListener('touchend', entry.onTouchEnd);
            if (entry.leftArrow && entry.leftArrow.parentNode)
                document.body.removeChild(entry.leftArrow);
            if (entry.rightArrow && entry.rightArrow.parentNode)
                document.body.removeChild(entry.rightArrow);
            _swipeRegistry.delete(element);
        };

        // Calendar scroll: wheel events change the selected day.
        const _calendarScrollRegistry = new Map();

        happie.registerCalendarScroll = function (element, dotNetRef) {
            if (!element) return;

            // Accumulate small deltaY values before triggering a day change.
            let accumulated = 0;
            const STEP_THRESHOLD = 50;

            const onWheel = (e) => {
                // Only intercept scroll when hovering over the calendar grid itself.
                const grid = element.querySelector('.calendar-grid');
                if (!grid || !grid.contains(e.target))
                    return;

                e.preventDefault();
                accumulated += e.deltaY;

                if (Math.abs(accumulated) >= STEP_THRESHOLD) {
                    const steps = Math.sign(accumulated);
                    accumulated = 0;
                    if (steps > 0)
                        dotNetRef.invokeMethodAsync('ScrollNextDay');
                    else
                        dotNetRef.invokeMethodAsync('ScrollPreviousDay');
                }
            };

            element.addEventListener('wheel', onWheel, { passive: false });
            _calendarScrollRegistry.set(element, { onWheel, dotNetRef });
        };

        happie.unregisterCalendarScroll = function (element) {
            if (!element) return;
            const entry = _calendarScrollRegistry.get(element);
            if (!entry) return;
            element.removeEventListener('wheel', entry.onWheel);
            _calendarScrollRegistry.delete(element);
        };

        // Listen for navigation messages from the service worker (notification click while app is open).
        if (navigator.serviceWorker) {
            navigator.serviceWorker.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'navigate' && event.data.url) {
                    var notificationHouseholdId = event.data.householdId;
                    var currentHouseholdId = localStorage.getItem('householdId');

                    // If the notification is from a different household, clear session and redirect to login
                    // with the target URL preserved as returnUrl.
                    if (notificationHouseholdId && currentHouseholdId && notificationHouseholdId !== currentHouseholdId) {
                        localStorage.removeItem('jwt');
                        localStorage.removeItem('activeHousemateId');
                        localStorage.removeItem('activeHousemateName');
                        localStorage.removeItem('activeHousemateColor');
                        localStorage.removeItem('householdId');
                        localStorage.setItem('returnUrl', event.data.url);
                        localStorage.setItem('returnUrlHouseholdId', notificationHouseholdId);
                        window.location.href = '/';
                    } else {
                        window.location.href = event.data.url;
                    }
                }
            });
        }

        // Decode the householdId claim from a JWT token without verifying the signature.
        happie.getHouseholdIdFromJwt = function (token) {
            try {
                var parts = token.split('.');
                if (parts.length !== 3) return null;
                var payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                return payload.householdId || null;
            } catch (error) {
                return null;
            }
        };

        // Check IndexedDB for a pending navigation URL (notification click that launched the app).
        // Returns an object with url and householdId, or null.
        happie.checkPendingNavigation = async function () {
            try {
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('happie-push', 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('credentials'))
                            db.createObjectStore('credentials');
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
                const tx = db.transaction('credentials', 'readwrite');
                const store = tx.objectStore('credentials');
                const url = await new Promise((resolve) => {
                    const req = store.get('pendingNavigation');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
                const householdId = await new Promise((resolve) => {
                    const req = store.get('pendingHouseholdId');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
                // Clear the pending navigation so it doesn't fire again.
                store.delete('pendingNavigation');
                store.delete('pendingHouseholdId');
                await new Promise((resolve) => { tx.oncomplete = resolve; });
                db.close();
                return url ? { url: url, householdId: householdId || null } : null;
            } catch (error) {
                console.error('Failed to check pending navigation:', error);
                return null;
            }
        };

        // Viewport width detection — registers a matchMedia listener for the mobile breakpoint.
        // Viewport width detection — per-instance registry keyed by element reference.
        // Multiple components can register independently without interfering with each other.
        const _viewportRegistry = new Map();

        // Returns the initial matches value (true = narrow viewport).
        happie.registerViewportListener = function (element, dotNetRef) {
            const mql = window.matchMedia('(max-width: 479.98px)');
            const handler = (e) => dotNetRef.invokeMethodAsync('HandleViewportChangeAsync', e.matches);
            mql.addEventListener('change', handler);
            _viewportRegistry.set(element, { mql, handler });
            return mql.matches;
        };

        // Removes the viewport matchMedia listener for a specific element.
        happie.unregisterViewportListener = function (element) {
            if (!element) return;
            const entry = _viewportRegistry.get(element);
            if (!entry) return;
            entry.mql.removeEventListener('change', entry.handler);
            _viewportRegistry.delete(element);
        };

        // Pointer device detection — one-time check.
        // Returns true if the primary input device supports hover (mouse/trackpad).
        happie.hasPointerDevice = function () {
            return window.matchMedia('(hover: hover)').matches;
        };

        // Height animation helpers — capture current height and animate to new content height.
        happie.captureHeight = function (element) {
            if (!element) return;
            var currentHeight = element.offsetHeight;
            element.style.height = currentHeight + 'px';
            element.style.overflow = 'hidden';
            element.style.transition = 'none';
        };

        happie.animateToContentHeight = function (element) {
            if (!element) return;
            // Respect prefers-reduced-motion: skip animation entirely.
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                element.style.height = '';
                element.style.overflow = '';
                element.style.transition = '';
                return;
            }
            // Force a reflow so the browser registers the fixed height.
            element.offsetHeight;
            // Temporarily remove height constraint to measure natural content height.
            var savedHeight = element.style.height;
            element.style.height = 'auto';
            var targetHeight = element.offsetHeight;
            // Restore the captured height immediately (no transition yet).
            element.style.height = savedHeight;
            // Force another reflow to lock in the starting height.
            element.offsetHeight;
            // Now animate to the target.
            element.style.transition = 'height 300ms ease';
            element.style.height = targetHeight + 'px';
            // Clean up after transition.
            var cleanup = function () {
                element.style.height = '';
                element.style.overflow = '';
                element.style.transition = '';
                element.removeEventListener('transitionend', cleanup);
            };
            element.addEventListener('transitionend', cleanup, { once: true });
            // Fallback cleanup in case transitionend never fires.
            setTimeout(cleanup, 350);
        };

        // Outside-click detection — per-instance registry keyed by elementId.
        // Multiple components can register independently without interfering with each other.
        const _outsideClickRegistry = new Map();

        // Invokes HandleOutsideClickAsync on the .NET reference when a click occurs
        // outside the element with the given elementId.
        happie.registerOutsideClick = function (dotNetRef, elementId) {
            const handler = (e) => {
                const element = document.getElementById(elementId);
                if (element && !element.contains(e.target))
                    dotNetRef.invokeMethodAsync('HandleOutsideClickAsync');
            };
            document.addEventListener('click', handler);
            _outsideClickRegistry.set(elementId, handler);
        };

        // Removes the outside-click document listener for a specific elementId.
        happie.unregisterOutsideClick = function (elementId) {
            const handler = _outsideClickRegistry.get(elementId);
            if (handler) {
                document.removeEventListener('click', handler);
                _outsideClickRegistry.delete(elementId);
            }
        };

        // Connectivity detection — wraps navigator.onLine and online/offline events.
        happie.getOnlineStatus = function () {
            return navigator.onLine;
        };

        happie.registerConnectivityListener = function (dotNetRef) {
            happie._connectivityDotNetRef = dotNetRef;
            happie._onOnline = function () {
                dotNetRef.invokeMethodAsync('OnConnectivityChangedCallback', true);
            };
            happie._onOffline = function () {
                dotNetRef.invokeMethodAsync('OnConnectivityChangedCallback', false);
            };
            window.addEventListener('online', happie._onOnline);
            window.addEventListener('offline', happie._onOffline);
        };

        happie.unregisterConnectivityListener = function () {
            if (happie._onOnline)
                window.removeEventListener('online', happie._onOnline);
            if (happie._onOffline)
                window.removeEventListener('offline', happie._onOffline);
            happie._onOnline = null;
            happie._onOffline = null;
            happie._connectivityDotNetRef = null;
        };
    </script>
    <script src="js/cacheDb.js"></script>
    <script src="js/swipeCarousel.js"></script>
</body>

</html>
