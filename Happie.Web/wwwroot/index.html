<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Happie</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Happie.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script>
        window.happie = window.happie || {};

        // Minimum horizontal distance (px) to trigger navigation.
        const SWIPE_THRESHOLD = 60;
        // Maximum horizontal drag (px) — adds rubber-band resistance beyond this.
        const MAX_DRAG = 120;
        // Duration (ms) for the slide-out / snap-back animation.
        const ANIM_DURATION = 250;

        // Map from element to its registered swipe state.
        const _swipeRegistry = new Map();

        happie.registerSwipe = function (element, dotNetRef) {
            if (!element) return;

            const state = {
                startX: 0,
                startY: 0,
                currentX: 0,
                tracking: false,
                locked: false,
                animating: false
            };

            // Create edge arrow indicators.
            const leftArrow = document.createElement('div');
            leftArrow.className = 'swipe-arrow swipe-arrow--left';
            leftArrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';

            const rightArrow = document.createElement('div');
            rightArrow.className = 'swipe-arrow swipe-arrow--right';
            rightArrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

            element.appendChild(leftArrow);
            element.appendChild(rightArrow);

            // Apply rubber-band resistance for a natural iOS feel.
            function rubberBand(offset) {
                const abs = Math.abs(offset);
                if (abs <= MAX_DRAG) return offset;
                const over = abs - MAX_DRAG;
                const dampened = MAX_DRAG + over * 0.3;
                return offset > 0 ? dampened : -dampened;
            }

            const onTouchStart = (e) => {
                if (state.animating) return;
                state.startX = e.touches[0].clientX;
                state.startY = e.touches[0].clientY;
                state.currentX = 0;
                state.tracking = true;
                state.locked = false;
                element.style.transition = 'none';
                element.style.willChange = 'transform';
            };

            const onTouchMove = (e) => {
                if (!state.tracking || state.animating) return;

                const deltaX = e.touches[0].clientX - state.startX;
                const deltaY = e.touches[0].clientY - state.startY;

                // Determine direction lock on first significant movement.
                if (!state.locked) {
                    if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) return;
                    // If more vertical than horizontal, abort tracking.
                    if (Math.abs(deltaY) > Math.abs(deltaX)) {
                        state.tracking = false;
                        element.style.transform = '';
                        element.style.willChange = '';
                        leftArrow.style.opacity = '0';
                        rightArrow.style.opacity = '0';
                        return;
                    }
                    state.locked = true;
                }

                // Prevent vertical scrolling while horizontal swipe is active.
                e.preventDefault();

                state.currentX = deltaX;
                const translated = rubberBand(deltaX);
                element.style.transform = 'translateX(' + translated + 'px)';

                // Show arrow indicator based on direction and progress.
                const progress = Math.min(Math.abs(deltaX) / SWIPE_THRESHOLD, 1);
                if (deltaX > 0) {
                    leftArrow.style.opacity = progress.toString();
                    leftArrow.classList.toggle('swipe-arrow--active', Math.abs(deltaX) >= SWIPE_THRESHOLD);
                    rightArrow.style.opacity = '0';
                    rightArrow.classList.remove('swipe-arrow--active');
                } else {
                    rightArrow.style.opacity = progress.toString();
                    rightArrow.classList.toggle('swipe-arrow--active', Math.abs(deltaX) >= SWIPE_THRESHOLD);
                    leftArrow.style.opacity = '0';
                    leftArrow.classList.remove('swipe-arrow--active');
                }
            };

            const onTouchEnd = (e) => {
                if (!state.tracking || !state.locked) {
                    state.tracking = false;
                    return;
                }
                state.tracking = false;

                const deltaX = state.currentX;
                const absDelta = Math.abs(deltaX);

                if (absDelta >= SWIPE_THRESHOLD) {
                    // Threshold met — slide off screen and navigate.
                    state.animating = true;
                    const direction = deltaX > 0 ? 1 : -1;
                    element.style.transition = 'transform ' + ANIM_DURATION + 'ms cubic-bezier(0.2, 0.9, 0.3, 1), opacity ' + ANIM_DURATION + 'ms ease';
                    element.style.transform = 'translateX(' + (direction * window.innerWidth * 0.4) + 'px)';
                    element.style.opacity = '0.3';

                    setTimeout(function () {
                        // Reset styles before navigation so the new page renders cleanly.
                        element.style.transition = 'none';
                        element.style.transform = '';
                        element.style.opacity = '';
                        element.style.willChange = '';
                        leftArrow.style.opacity = '0';
                        rightArrow.style.opacity = '0';
                        leftArrow.classList.remove('swipe-arrow--active');
                        rightArrow.classList.remove('swipe-arrow--active');
                        state.animating = false;

                        if (deltaX < 0)
                            dotNetRef.invokeMethodAsync('SwipeLeftAsync');
                        else
                            dotNetRef.invokeMethodAsync('SwipeRightAsync');
                    }, ANIM_DURATION);
                } else {
                    // Below threshold — snap back.
                    element.style.transition = 'transform ' + ANIM_DURATION + 'ms cubic-bezier(0.2, 0.9, 0.3, 1)';
                    element.style.transform = 'translateX(0)';
                    leftArrow.style.opacity = '0';
                    rightArrow.style.opacity = '0';
                    leftArrow.classList.remove('swipe-arrow--active');
                    rightArrow.classList.remove('swipe-arrow--active');

                    setTimeout(function () {
                        element.style.transition = '';
                        element.style.transform = '';
                        element.style.willChange = '';
                    }, ANIM_DURATION);
                }
            };

            element.addEventListener('touchstart', onTouchStart, { passive: true });
            element.addEventListener('touchmove', onTouchMove, { passive: false });
            element.addEventListener('touchend', onTouchEnd, { passive: true });

            _swipeRegistry.set(element, { onTouchStart, onTouchMove, onTouchEnd, dotNetRef, leftArrow, rightArrow });
        };

        happie.unregisterSwipe = function (element) {
            if (!element) return;
            const entry = _swipeRegistry.get(element);
            if (!entry) return;
            element.removeEventListener('touchstart', entry.onTouchStart);
            element.removeEventListener('touchmove', entry.onTouchMove);
            element.removeEventListener('touchend', entry.onTouchEnd);
            if (entry.leftArrow && entry.leftArrow.parentNode)
                entry.leftArrow.parentNode.removeChild(entry.leftArrow);
            if (entry.rightArrow && entry.rightArrow.parentNode)
                entry.rightArrow.parentNode.removeChild(entry.rightArrow);
            _swipeRegistry.delete(element);
        };
    </script>
</body>

</html>
