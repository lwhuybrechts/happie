name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: false
        default: "production"
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test Happie.Api.Tests --configuration Release --no-build --verbosity normal

      - name: Run Web tests
        run: dotnet test Happie.Web.Tests --configuration Release --no-build --verbosity normal

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite
        run: azurite --silent &
        shell: bash

      - name: Run Integration tests
        run: dotnet test Happie.Api.IntegrationTests --configuration Release --no-build --verbosity normal

      - name: Publish Happie.Web
        run: dotnet publish Happie.Web --configuration Release --output ./publish/web

      - name: Stamp version in appsettings.json
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '\n\r')
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
          sed -i "s/\"AppVersion\": \"1.0.0\"/\"AppVersion\": \"$VERSION\"/" ./publish/web/wwwroot/appsettings.json
          echo "App version: $VERSION"

      - name: Publish Happie.Api
        run: dotnet publish Happie.Api --configuration Release --output ./publish/api

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: happie-web
          path: ./publish/web

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: happie-api
          path: ./publish/api
          include-hidden-files: true

  deploy-swa:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: happie-web
          path: ./web

      - name: Prepare deployment folder
        run: cp ./web/staticwebapp.config.json ./web/wwwroot/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./web/wwwroot"
          skip_app_build: true
          skip_api_build: true

  deploy-functions:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: happie-api
          path: ./api

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: happie-func
          package: ./api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
